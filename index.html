<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Communicator</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- Top bar -->
        <div class="top-bar">
            <h2>P2P Communicator <span class="badge" id="connection-status">Offline</span></h2>
            <div>
                <button id="export-btn" style="background: transparent; border-color: var(--border);">Export .sav</button>
            </div>
        </div>

        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="panel">
                <h3>Your Identity</h3>
                <label style="font-size: 0.85em; color: var(--muted);">Username:</label>
                <input type="text" id="username-input" value="Receiver" maxlength="16">
                <label style="font-size: 0.85em; color: var(--muted);">Custom ID:</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="custom-id-input" placeholder="Random" maxlength="8" style="text-transform: uppercase; margin-bottom:0;">
                    <button id="set-id-btn" style="padding: 8px 12px;">Set</button>
                </div>
                <p style="margin: 8px 0 0 0; font-size: 0.9em;">Your ID: <strong id="my-id" style="color: var(--accent);">...</strong></p>
            </div>

            <div class="panel" style="flex-grow:1; display:flex; flex-direction:column; margin-bottom:0;">
                <h3>Conversations</h3>
                <div class="peer-list" id="history-list"></div>
            </div>
        </div>

        <!-- Right Main Chat -->
        <div class="chat-area">
            <div class="panel" style="margin-bottom: 10px;">
                <h3>Connect to Peer</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="target-id" placeholder="Enter peer ID (e.g., A1B2C)" style="text-transform: uppercase; margin-bottom:0;">
                    <button id="connect-btn">Connect</button>
                </div>
            </div>

            <!-- Video Stream Preview -->
            <div id="video-container" class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px; border-bottom: 1px solid var(--border);">
                    <span style="font-size: 0.8em; color: var(--muted);">Video Stream</span>
                    <button id="fullscreen-btn" style="padding: 2px 8px; font-size: 0.75em; background: transparent; border-color: var(--border);">Fullscreen</button>
                </div>
                <video id="remote-video" autoplay playsinline></video>
                <button id="stop-stream-btn" style="background: var(--danger); border-color: var(--danger); width: 100%; margin-top: 5px; display: none; padding: 4px;">Stop Stream</button>
            </div>

            <div class="panel" style="flex-grow: 1; display: flex; flex-direction: column; margin-bottom: 10px;">
                <h3>Active Chat</h3>
                <div id="log"></div>
                <div class="stats" id="transfer-stats">Sent: 0 KB | Received: 0 KB</div>
            </div>

            <!-- Controls -->
            <div class="controls-row">
                <input type="text" id="message-input" placeholder="Type a message..." style="margin-bottom:0;" disabled>
                <button id="send-btn" disabled>Send</button>
            </div>
            
            <div class="controls-row">
                <label for="file-input" class="file-btn" id="file-label" style="flex: 1; opacity: 0.4; pointer-events: none;">File (max 64MB)</label>
                <input type="file" id="file-input" disabled>
                <select id="resolution-select" style="flex: 1; margin-bottom: 0;">
                    <option value="144">144p</option>
                    <option value="240" selected>240p</option>
                    <option value="360">360p</option>
                    <option value="480">480p</option>
                    <option value="720">720p</option>
                    <option value="1080">1080p</option>
                </select>
                <button id="stream-btn" style="flex: 1; background: var(--accent); border-color: var(--accent);" disabled>Stream</button>
            </div>
        </div>
    </div>

    <script>
        const MAX_FILE_SIZE = 64 * 1024 * 1024; // 64 MB in bytes

        function generateHexId() {
            return Math.floor(Math.random() * 1048576).toString(16).padStart(5, '0').toUpperCase();
        }

        let savedMyId = localStorage.getItem('p2p_my_id') || generateHexId();
        document.getElementById('custom-id-input').value = savedMyId;

        let peer = null;
        let conn = null;
        let localStream = null;
        let currentCall = null;
        let activeTargetHex = null;
        let bytesSent = 0;
        let bytesReceived = 0;
        let statsInterval = null;

        let db = JSON.parse(localStorage.getItem('p2p_db') || '{}');

        const logDiv = document.getElementById('log');
        const historyList = document.getElementById('history-list');
        const statsDiv = document.getElementById('transfer-stats');
        const statusBadge = document.getElementById('connection-status');
        const videoContainer = document.getElementById('video-container');
        const remoteVideo = document.getElementById('remote-video');

        function initPeer(idToUse) {
            if (peer) peer.destroy();
            
            peer = new Peer('p2p-proto-' + idToUse, {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = idToUse;
                localStorage.setItem('p2p_my_id', idToUse);
                statusBadge.innerText = "Online";
                statusBadge.style.background = "var(--success)";
                log(`Your node is active with ID: ${idToUse}`);
                renderHistoryList();
            });

            peer.on('error', (err) => {
                alert("PeerJS Error (ID might be taken): " + err.type);
                statusBadge.innerText = "ID Error";
                statusBadge.style.background = "#ef4444";
            });

            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                activeTargetHex = conn.peer.replace('p2p-proto-', '');
                setupConnection();
                log(`Incoming connection established from: ${activeTargetHex}`, 'SUCCESS');
            });

            peer.on('call', (call) => {
                currentCall = call;
                call.answer();
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    videoContainer.style.display = 'block';
                    document.getElementById('stop-stream-btn').style.display = 'block';
                    log(`Received video stream from ${call.peer.replace('p2p-proto-', '')}`, 'STREAM');
                    
                    startExactStatsPolling(call.peerConnection, false);
                });
                call.on('close', () => {
                    stopRemoteStreamView();
                });
            });
        }

        initPeer(savedMyId);

        document.getElementById('set-id-btn').addEventListener('click', () => {
            let newId = document.getElementById('custom-id-input').value.trim().toUpperCase();
            if (newId.length < 3) {
                alert("ID must be at least 3 characters long.");
                return;
            }
            initPeer(newId);
        });

        function log(text, sender = 'SYS') {
            logDiv.innerHTML += `<div class="msg"><strong>[${sender}]:</strong> ${text}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStats() {
            statsDiv.innerText = `Sent: ${(bytesSent / 1024).toFixed(2)} KB | Received: ${(bytesReceived / 1024).toFixed(2)} KB`;
        }

        function saveMessageToDb(targetHex, senderName, text) {
            if (!db[targetHex]) db[targetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
            db[targetHex].messages.push({ sender: senderName, text, time: Date.now() });
            localStorage.setItem('p2p_db', JSON.stringify(db));
            renderHistoryList();
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            const keys = Object.keys(db);
            if (keys.length === 0) {
                historyList.innerHTML = '<div class="peer-item" style="color:var(--muted); text-align:center;">No chat history</div>';
                return;
            }
            keys.forEach(hex => {
                const item = document.createElement('div');
                item.className = 'peer-item';
                item.innerHTML = `<strong>ID: ${hex}</strong> <span style="float:right; color:var(--muted);">${db[hex].messages.length} msgs</span>`;
                item.onclick = () => loadChatSession(hex);
                historyList.appendChild(item);
            });
        }

        function loadChatSession(hex) {
            if (conn && conn.open) conn.close();
            activeTargetHex = hex;
            logDiv.innerHTML = '';
            
            if (db[hex]) {
                db[hex].messages.forEach(m => log(m.text, m.sender));
                bytesSent = db[hex].sentBytes || 0;
                bytesReceived = db[hex].receivedBytes || 0;
            } else {
                bytesSent = 0;
                bytesReceived = 0;
            }
            updateStats();

            let fullTargetId = 'p2p-proto-' + hex;
            log(`Connecting to session ${hex}...`);
            conn = peer.connect(fullTargetId);
            setupConnection();
        }

        document.getElementById('connect-btn').addEventListener('click', () => {
            let targetInput = document.getElementById('target-id').value.trim().toUpperCase();
            if (targetInput.length === 0) {
                alert('Please enter target peer ID');
                return;
            }
            loadChatSession(targetInput);
        });

        function setControlsActive(active) {
            document.getElementById('send-btn').disabled = !active;
            document.getElementById('message-input').disabled = !active;
            document.getElementById('stream-btn').disabled = !active;
            const fileInput = document.getElementById('file-input');
            const fileLabel = document.getElementById('file-label');
            fileInput.disabled = !active;
            fileLabel.style.opacity = active ? "1" : "0.4";
            fileLabel.style.pointerEvents = active ? "auto" : "none";
        }

        function setupConnection() {
            conn.on('open', () => {
                setControlsActive(true);
                log(`P2P connection active with ${activeTargetHex}`, 'SUCCESS');
            });

            conn.on('data', (data) => {
                if (typeof data === 'object' && data.fileBuffer) {
                    bytesReceived += data.fileBuffer.byteLength;
                    updateStats();

                    const blob = new Blob([data.fileBuffer]);
                    const blobUrl = URL.createObjectURL(blob);
                    const fileMsg = `[FILE]: <a href="${blobUrl}" download="${data.fileName}" style="color: var(--accent);">${data.fileName}</a> (${(data.fileBuffer.byteLength / (1024*1024)).toFixed(2)} MB)`;
                    
                    log(fileMsg, activeTargetHex);
                    saveMessageToDb(activeTargetHex, activeTargetHex, fileMsg);
                } else {
                    bytesReceived += new Blob([data]).size;
                    if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                    db[activeTargetHex].receivedBytes = bytesReceived;
                    
                    updateStats();
                    log(data, activeTargetHex);
                    saveMessageToDb(activeTargetHex, activeTargetHex, data);
                }
            });

            conn.on('close', () => {
                setControlsActive(false);
                log(`Connection closed.`);
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            let username = document.getElementById('username-input').value.trim() || "Receiver";
            const msg = document.getElementById('message-input').value;
            if (msg && conn && conn.open) {
                const payload = `${username}: ${msg}`;
                conn.send(payload);
                
                bytesSent += new Blob([payload]).size;
                if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                db[activeTargetHex].sentBytes = bytesSent;
                updateStats();

                log(payload, 'You');
                saveMessageToDb(activeTargetHex, 'You', payload);
                document.getElementById('message-input').value = '';
            }
        }

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > MAX_FILE_SIZE) {
                alert(`File too large! Maximum limit is 64 MB. Your file is ${(file.size / (1024*1024)).toFixed(2)} MB.`);
                e.target.value = '';
                return;
            }

            if (conn && conn.open) {
                log(`Sending file: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)...`);
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const arrayBuffer = event.target.result;
                    conn.send({ fileBuffer: arrayBuffer, fileName: file.name });

                    bytesSent += arrayBuffer.byteLength;
                    if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                    db[activeTargetHex].sentBytes = bytesSent;
                    updateStats();

                    const localFileMsg = `[SENT FILE]: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)`;
                    log(localFileMsg, 'You');
                    saveMessageToDb(activeTargetHex, 'You', localFileMsg);
                    e.target.value = '';
                };
                reader.readAsArrayBuffer(file);
            } else {
                alert("No active P2P connection.");
            }
        });

        function startExactStatsPolling(pc, isSender) {
            if (statsInterval) clearInterval(statsInterval);
            
            let previousBytes = 0;

            statsInterval = setInterval(async () => {
                if (!pc) return;
                try {
                    const stats = await pc.getStats();
                    stats.forEach(report => {
                        if (isSender && report.type === 'outbound-rtp' && report.mediaType === 'video') {
                            const currentBytes = report.bytesSent;
                            if (currentBytes && previousBytes) {
                                const diff = currentBytes - previousBytes;
                                if (diff > 0) {
                                    bytesSent += diff;
                                    if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                                    db[activeTargetHex].sentBytes = bytesSent;
                                    updateStats();
                                }
                            }
                            previousBytes = currentBytes;
                        } else if (!isSender && report.type === 'inbound-rtp' && report.mediaType === 'video') {
                            const currentBytes = report.bytesReceived;
                            if (currentBytes && previousBytes) {
                                const diff = currentBytes - previousBytes;
                                if (diff > 0) {
                                    bytesReceived += diff;
                                    if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                                    db[activeTargetHex].receivedBytes = bytesReceived;
                                    updateStats();
                                }
                            }
                            previousBytes = currentBytes;
                        }
                    });
                } catch (e) {
                    console.error("getStats error:", e);
                }
            }, 1000);
        }

        // Resolution map: width, height, frame rate
        const resolutions = {
            "144": { width: 256, height: 144, frameRate: 10 },
            "240": { width: 426, height: 240, frameRate: 15 },
            "360": { width: 640, height: 360, frameRate: 20 },
            "480": { width: 854, height: 480, frameRate: 24 },
            "720": { width: 1280, height: 720, frameRate: 30 },
            "1080": { width: 1920, height: 1080, frameRate: 30 }
        };

        document.getElementById('stream-btn').addEventListener('click', async () => {
            if (!activeTargetHex) return;

            const resChoice = document.getElementById('resolution-select').value;
            const config = resolutions[resChoice] || resolutions["240"];

            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: config.width },
                        height: { ideal: config.height },
                        frameRate: { ideal: config.frameRate }
                    },
                    audio: false
                });

                let fullTargetId = 'p2p-proto-' + activeTargetHex;
                let call = peer.call(fullTargetId, localStream);
                currentCall = call;

                videoContainer.style.display = 'block';
                remoteVideo.srcObject = localStream;
                document.getElementById('stop-stream-btn').style.display = 'block';
                log(`Started screen streaming (${resChoice}p)...`, "STREAM");

                startExactStatsPolling(call.peerConnection, true);

                localStream.getVideoTracks()[0].onended = () => {
                    stopLocalStream();
                };

            } catch (err) {
                console.error(err);
                alert("Failed to share screen.");
            }
        });

        // Fullscreen video toggle
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (remoteVideo.requestFullscreen) {
                remoteVideo.requestFullscreen();
            } else if (remoteVideo.webkitRequestFullscreen) {
                remoteVideo.webkitRequestFullscreen();
            } else if (remoteVideo.msRequestFullscreen) {
                remoteVideo.msRequestFullscreen();
            }
        });

        function stopLocalStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }
            videoContainer.style.display = 'none';
            remoteVideo.srcObject = null;
            document.getElementById('stop-stream-btn').style.display = 'none';
            log("Stopped screen streaming.", "STREAM");
        }

        function stopRemoteStreamView() {
            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }
            videoContainer.style.display = 'none';
            remoteVideo.srcObject = null;
            document.getElementById('stop-stream-btn').style.display = 'none';
        }

        document.getElementById('stop-stream-btn').addEventListener('click', stopLocalStream);

        document.getElementById('export-btn').onclick = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `p2p_session_${savedMyId}.sav`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };
    </script>
</body>
</html>
