<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P2P Protocol + Multi-Resolution Stream & 64MB Files</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0d0f18;
            --surface: #151824;
            --surface-hover: #1e2235;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #06b6d4;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: #2a2f45;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 0px;
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2, h3, h4 { margin-top: 0; letter-spacing: 0.5px; }
        
        button, input, select, label.file-btn {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 14px;
            font-family: var(--font);
            border-radius: var(--radius);
            outline: none;
            box-sizing: border-box;
            font-size: 0.95em;
            transition: all 0.2s ease;
        }

        button, label.file-btn {
            background: var(--primary);
            border-color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            text-align: center;
        }

        button:hover:not(:disabled), label.file-btn:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        input[type="text"], select { width: 100%; margin-bottom: 10px; }
        input[type="text"]:focus, select:focus { border-color: var(--primary); }

        .panel {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: var(--radius);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .peer-list {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 250px;
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: var(--radius);
            background: var(--surface);
        }

        .peer-item {
            padding: 8px 10px;
            margin-bottom: 4px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.15s;
        }

        .peer-item:hover { background: var(--surface-hover); border-color: var(--border); }

        .chat-area {
            display: flex;
            flex-direction: column;
            height: 720px;
        }

        #log {
            flex-grow: 1;
            border: 1px solid var(--border);
            background: var(--bg);
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: var(--radius);
            font-size: 0.95em;
        }

        .msg { margin-bottom: 8px; word-break: break-all; line-height: 1.4; }
        .msg strong { color: var(--accent); }
        
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .stats {
            font-size: 0.85em;
            color: var(--muted);
            margin-top: 5px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            grid-column: 1 / -1;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75em;
            border-radius: var(--radius);
            background: var(--success);
            color: #fff;
            font-weight: bold;
            vertical-align: middle;
        }

        input[type="file"] { display: none; }

        #video-container {
            margin-bottom: 10px;
            background: #000;
            border: 1px solid var(--border);
            display: none;
            position: relative;
            text-align: center;
        }
        video {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top bar -->
        <div class="top-bar">
            <h2>P2P Protocol + Multi-Res Stream & 64MB <span class="badge" id="connection-status">Offline</span></h2>
            <div>
                <button id="export-btn" style="background: transparent; border-color: var(--border);">Eksportuj .sav</button>
            </div>
        </div>

        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="panel">
                <h3>Twoja Tożsamość</h3>
                <label style="font-size: 0.85em; color: var(--muted);">Nazwa użytkownika:</label>
                <input type="text" id="username-input" value="Anon" maxlength="16">
                <label style="font-size: 0.85em; color: var(--muted);">Własne ID:</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="custom-id-input" placeholder="Losowe" maxlength="8" style="text-transform: uppercase; margin-bottom:0;">
                    <button id="set-id-btn" style="padding: 8px 12px;">Ustaw</button>
                </div>
                <p style="margin: 8px 0 0 0; font-size: 0.9em;">Twoje ID: <strong id="my-id" style="color: var(--accent);">...</strong></p>
            </div>

            <div class="panel" style="flex-grow:1; display:flex; flex-direction:column; margin-bottom:0;">
                <h3>Konwersacje</h3>
                <div class="peer-list" id="history-list"></div>
            </div>
        </div>

        <!-- Right Main Chat -->
        <div class="chat-area">
            <div class="panel" style="margin-bottom: 10px;">
                <h3>Połącz z użytkownikiem</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="target-id" placeholder="Wpisz ID peera (np. A1B2C)" style="text-transform: uppercase; margin-bottom:0;">
                    <button id="connect-btn">Połącz</button>
                </div>
            </div>

            <!-- Podgląd wideo streamu -->
            <div id="video-container" class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px; border-bottom: 1px solid var(--border);">
                    <span style="font-size: 0.8em; color: var(--muted);">Strumień wideo</span>
                    <button id="fullscreen-btn" style="padding: 2px 8px; font-size: 0.75em; background: transparent; border-color: var(--border);">Pełny ekran</button>
                </div>
                <video id="remote-video" autoplay playsinline></video>
                <button id="stop-stream-btn" style="background: var(--danger); border-color: var(--danger); width: 100%; margin-top: 5px; display: none; padding: 4px;">Zatrzymaj Stream</button>
            </div>

            <div class="panel" style="flex-grow: 1; display: flex; flex-direction: column; margin-bottom: 10px;">
                <h3>Aktywny Czat</h3>
                <div id="log"></div>
                <div class="stats" id="transfer-stats">Wysłano: 0 KB | Odebrano: 0 KB</div>
            </div>

            <!-- Kontrolki -->
            <div class="controls-row">
                <input type="text" id="message-input" placeholder="Napisz wiadomość..." style="margin-bottom:0;" disabled>
                <button id="send-btn" disabled>Wyślij</button>
            </div>
            
            <div class="controls-row">
                <label for="file-input" class="file-btn" id="file-label" style="flex: 1; opacity: 0.4; pointer-events: none;">Plik (max 64MB)</label>
                <input type="file" id="file-input" disabled>
                <select id="resolution-select" style="flex: 1; margin-bottom: 0;">
                    <option value="144">144p</option>
                    <option value="240" selected>240p</option>
                    <option value="360">360p</option>
                    <option value="480">480p</option>
                    <option value="720">720p</option>
                </select>
                <button id="stream-btn" style="flex: 1; background: var(--accent); border-color: var(--accent);" disabled>Stream</button>
            </div>
        </div>
    </div>

    <script>
        const MAX_FILE_SIZE = 64 * 1024 * 1024; // 64 MB w bajtach

        function generateHexId() {
            return Math.floor(Math.random() * 1048576).toString(16).padStart(5, '0').toUpperCase();
        }

        let savedMyId = localStorage.getItem('p2p_my_id') || generateHexId();
        document.getElementById('custom-id-input').value = savedMyId;

        let peer = null;
        let conn = null;
        let localStream = null;
        let currentCall = null;
        let activeTargetHex = null;
        let bytesSent = 0;
        let bytesReceived = 0;
        let statsInterval = null;

        let db = JSON.parse(localStorage.getItem('p2p_db') || '{}');

        const logDiv = document.getElementById('log');
        const historyList = document.getElementById('history-list');
        const statsDiv = document.getElementById('transfer-stats');
        const statusBadge = document.getElementById('connection-status');
        const videoContainer = document.getElementById('video-container');
        const remoteVideo = document.getElementById('remote-video');

        function initPeer(idToUse) {
            if (peer) peer.destroy();
            
            peer = new Peer('p2p-proto-' + idToUse, {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = idToUse;
                localStorage.setItem('p2p_my_id', idToUse);
                statusBadge.innerText = "Online";
                statusBadge.style.background = "var(--success)";
                log(`Twój węzeł jest aktywny z ID: ${idToUse}`);
                renderHistoryList();
            });

            peer.on('error', (err) => {
                alert("Błąd PeerJS (ID może być zajęte): " + err.type);
                statusBadge.innerText = "Błąd ID";
                statusBadge.style.background = "#ef4444";
            });

            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                activeTargetHex = conn.peer.replace('p2p-proto-', '');
                setupConnection();
                log(`Nawiązano połączenie przychodzące od: ${activeTargetHex}`, 'SUKCES');
            });

            peer.on('call', (call) => {
                currentCall = call;
                call.answer();
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    videoContainer.style.display = 'block';
                    document.getElementById('stop-stream-btn').style.display = 'block';
                    log(`Odebrano strumień wideo od ${call.peer.replace('p2p-proto-', '')}`, 'STREAM');
                    
                    startExactStatsPolling(call.peerConnection, false);
                });
                call.on('close', () => {
                    stopRemoteStreamView();
                });
            });
        }

        initPeer(savedMyId);

        document.getElementById('set-id-btn').addEventListener('click', () => {
            let newId = document.getElementById('custom-id-input').value.trim().toUpperCase();
            if (newId.length < 3) {
                alert("ID musi mieć co najmniej 3 znaki.");
                return;
            }
            initPeer(newId);
        });

        function log(text, sender = 'SYS') {
            logDiv.innerHTML += `<div class="msg"><strong>[${sender}]:</strong> ${text}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStats() {
            statsDiv.innerText = `Wysłano: ${(bytesSent / 1024).toFixed(2)} KB | Odebrano: ${(bytesReceived / 1024).toFixed(2)} KB`;
        }

        function saveMessageToDb(targetHex, senderName, text) {
            if (!db[targetHex]) db[targetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
            db[targetHex].messages.push({ sender: senderName, text, time: Date.now() });
            localStorage.setItem('p2p_db', JSON.stringify(db));
            renderHistoryList();
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            const keys = Object.keys(db);
            if (keys.length === 0) {
                historyList.innerHTML = '<div class="peer-item" style="color:var(--muted); text-align:center;">Brak historii rozmów</div>';
                return;
            }
            keys.forEach(hex => {
                const item = document.createElement('div');
                item.className = 'peer-item';
                item.innerHTML = `<strong>ID: ${hex}</strong> <span style="float:right; color:var(--muted);">${db[hex].messages.length} wiad.</span>`;
                item.onclick = () => loadChatSession(hex);
                historyList.appendChild(item);
            });
        }

        function loadChatSession(hex) {
            if (conn && conn.open) conn.close();
            activeTargetHex = hex;
            logDiv.innerHTML = '';
            
            if (db[hex]) {
                db[hex].messages.forEach(m => log(m.text, m.sender));
                bytesSent = db[hex].sentBytes || 0;
                bytesReceived = db[hex].receivedBytes || 0;
            } else {
                bytesSent = 0;
                bytesReceived = 0;
            }
            updateStats();

            let fullTargetId = 'p2p-proto-' + hex;
            log(`Łączenie z sesją ${hex}...`);
            conn = peer.connect(fullTargetId);
            setupConnection();
        }

        document.getElementById('connect-btn').addEventListener('click', () => {
            let targetInput = document.getElementById('target-id').value.trim().toUpperCase();
            if (targetInput.length === 0) {
                alert('Wpisz ID użytkownika docelowego');
                return;
            }
            loadChatSession(targetInput);
        });

        function setControlsActive(active) {
            document.getElementById('send-btn').disabled = !active;
            document.getElementById('message-input').disabled = !active;
            document.getElementById('stream-btn').disabled = !active;
            const fileInput = document.getElementById('file-input');
            const fileLabel = document.getElementById('file-label');
            fileInput.disabled = !active;
            fileLabel.style.opacity = active ? "1" : "0.4";
            fileLabel.style.pointerEvents = active ? "auto" : "none";
        }

        function setupConnection() {
            conn.on('open', () => {
                setControlsActive(true);
                log(`Połączenie P2P aktywne z ${activeTargetHex}`, 'SUKCES');
            });

            conn.on('data', (data) => {
                if (typeof data === 'object' && data.fileBuffer) {
                    bytesReceived += data.fileBuffer.byteLength;
                    updateStats();

                    const blob = new Blob([data.fileBuffer]);
                    const blobUrl = URL.createObjectURL(blob);
                    const fileMsg = `[PLIK]: <a href="${blobUrl}" download="${data.fileName}" style="color: var(--accent);">${data.fileName}</a> (${(data.fileBuffer.byteLength / (1024*1024)).toFixed(2)} MB)`;
                    
                    log(fileMsg, activeTargetHex);
                    saveMessageToDb(activeTargetHex, activeTargetHex, fileMsg);
                } else {
                    bytesReceived += new Blob([data]).size;
                    if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                    db[activeTargetHex].receivedBytes = bytesReceived;
                    
                    updateStats();
                    log(data, activeTargetHex);
                    saveMessageToDb(activeTargetHex, activeTargetHex, data);
                }
            });

            conn.on('close', () => {
                setControlsActive(false);
                log(`Połączenie zostało zamknięte.`);
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            let username = document.getElementById('username-input').value.trim() || "Anon";
            const msg = document.getElementById('message-input').value;
            if (msg && conn && conn.open) {
                const payload = `${username}: ${msg}`;
                conn.send(payload);
                
                bytesSent += new Blob([payload]).size;
                if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                db[activeTargetHex].sentBytes = bytesSent;
                updateStats();

                log(payload, 'Ty');
                saveMessageToDb(activeTargetHex, 'Ty', payload);
                document.getElementById('message-input').value = '';
            }
        }

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > MAX_FILE_SIZE) {
                alert(`Plik za duży! Maksymalnie do 64 MB. Twój plik ma ${(file.size / (1024*1024)).toFixed(2)} MB.`);
                e.target.value = '';
                return;
            }

            if (conn && conn.open) {
                log(`Wysyłanie pliku: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)...`);
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const arrayBuffer = event.target.result;
                    conn.send({ fileBuffer: arrayBuffer, fileName: file.name });

                    bytesSent += arrayBuffer.byteLength;
                    if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                    db[activeTargetHex].sentBytes = bytesSent;
                    updateStats();

                    const localFileMsg = `[WYSŁANO PLIK]: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)`;
                    log(localFileMsg, 'Ty');
                    saveMessageToDb(activeTargetHex, 'Ty', localFileMsg);
                    e.target.value = '';
                };
                reader.readAsArrayBuffer(file);
            } else {
                alert("Brak aktywnego połączenia P2P.");
            }
        });

        function startExactStatsPolling(pc, isSender) {
            if (statsInterval) clearInterval(statsInterval);
            
            let previousBytes = 0;

            statsInterval = setInterval(async () => {
                if (!pc) return;
                try {
                    const stats = await pc.getStats();
                    stats.forEach(report => {
                        if (isSender && report.type === 'outbound-rtp' && report.mediaType === 'video') {
                            const currentBytes = report.bytesSent;
                            if (currentBytes && previousBytes) {
                                const diff = currentBytes - previousBytes;
                                if (diff > 0) {
                                    bytesSent += diff;
                                    if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                                    db[activeTargetHex].sentBytes = bytesSent;
                                    updateStats();
                                }
                            }
                            previousBytes = currentBytes;
                        } else if (!isSender && report.type === 'inbound-rtp' && report.mediaType === 'video') {
                            const currentBytes = report.bytesReceived;
                            if (currentBytes && previousBytes) {
                                const diff = currentBytes - previousBytes;
                                if (diff > 0) {
                                    bytesReceived += diff;
                                    if (!db[activeTargetHex]) db[activeTargetHex] = { messages: [], sentBytes: 0, receivedBytes: 0 };
                                    db[activeTargetHex].receivedBytes = bytesReceived;
                                    updateStats();
                                }
                            }
                            previousBytes = currentBytes;
                        }
                    });
                } catch (e) {
                    console.error("Błąd getStats:", e);
                }
            }, 1000);
        }

        // Mapowanie wybranej rozdzielczości na szerokość, wysokość i klatkaż
        const resolutions = {
            "144": { width: 256, height: 144, frameRate: 10 },
            "240": { width: 426, height: 240, frameRate: 15 },
            "360": { width: 640, height: 360, frameRate: 20 },
            "480": { width: 854, height: 480, frameRate: 24 },
            "720": { width: 1280, height: 720, frameRate: 30 }
        };

        document.getElementById('stream-btn').addEventListener('click', async () => {
            if (!activeTargetHex) return;

            const resChoice = document.getElementById('resolution-select').value;
            const config = resolutions[resChoice] || resolutions["240"];

            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: config.width },
                        height: { ideal: config.height },
                        frameRate: { ideal: config.frameRate }
                    },
                    audio: false
                });

                let fullTargetId = 'p2p-proto-' + activeTargetHex;
                let call = peer.call(fullTargetId, localStream);
                currentCall = call;

                videoContainer.style.display = 'block';
                remoteVideo.srcObject = localStream;
                document.getElementById('stop-stream-btn').style.display = 'block';
                log(`Rozpoczęto strumieniowanie ekranu (${resChoice}p)...`, "STREAM");

                startExactStatsPolling(call.peerConnection, true);

                localStream.getVideoTracks()[0].onended = () => {
                    stopLocalStream();
                };

            } catch (err) {
                console.error(err);
                alert("Nie udało się udostępnić ekranu.");
            }
        });

        // Obsługa pełnego ekranu dla wideo
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (remoteVideo.requestFullscreen) {
                remoteVideo.requestFullscreen();
            } else if (remoteVideo.webkitRequestFullscreen) {
                remoteVideo.webkitRequestFullscreen();
            } else if (remoteVideo.msRequestFullscreen) {
                remoteVideo.msRequestFullscreen();
            }
        });

        function stopLocalStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }
            videoContainer.style.display = 'none';
            remoteVideo.srcObject = null;
            document.getElementById('stop-stream-btn').style.display = 'none';
            log("Zatrzymano strumieniowanie ekranu.", "STREAM");
        }

        function stopRemoteStreamView() {
            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }
            videoContainer.style.display = 'none';
            remoteVideo.srcObject = null;
            document.getElementById('stop-stream-btn').style.display = 'none';
        }

        document.getElementById('stop-stream-btn').addEventListener('click', stopLocalStream);

        document.getElementById('export-btn').onclick = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `p2p_session_${savedMyId}.sav`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };
    </script>
</body>
</html>
